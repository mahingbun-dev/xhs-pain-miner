[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-pain-miner"
version = "0.1.0"
description = "🔍 Turn real user pain points from Xiaohongshu (小红书/RedNote) into buildable product opportunities. Clusters pain points from posts and comments, researches existing competitors, and scores each opportunity."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "XHS Pain Miner Contributors"},
]
keywords = [
    "xiaohongshu",
    "小红书",
    "rednote",
    "pain-point",
    "opportunity-discovery",
    "product-opportunity",
    "indie-hacker",
    "user-insights",
    "voc",
    "voice-of-customer",
    "user-research",
    "consumer-insights",
    "product-management",
    "clustering",
    "social-media-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# 核心依赖保持轻量：只含 CLI、配置、LLM 协议适配所需的包。
# 计算密集型依赖（numpy / scikit-learn / sentence-transformers）放在 [analysis] extra。
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
    "openai>=1.66",     # Chat Completions + Responses API + 所有 OpenAI 兼容服务 (DeepSeek/Qwen/Kimi/GLM)
    "anthropic>=0.40",  # Anthropic Messages API
]

[project.optional-dependencies]
# 痛点聚类与本地 embedding（bge-small-zh），M1 核心链路需要
analysis = [
    "numpy>=1.26",
    "scikit-learn>=1.4",       # 提供原生 HDBSCAN（>=1.3），无需额外的 hdbscan 包
    "sentence-transformers>=3.0",
]
# VLM 图片分析（--deep）：图片去重、压缩、缓存
vlm = [
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # 锁定次版本：ruff 的 minor 版本会调整格式规则，版本漂移会让 CI 的
    # `ruff format --check` 门禁在无关 PR 上无故变红
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
]
all = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/mahingbun-dev/xhs-pain-miner"
Documentation = "https://github.com/mahingbun-dev/xhs-pain-miner#readme"
Repository = "https://github.com/mahingbun-dev/xhs-pain-miner"
Issues = "https://github.com/mahingbun-dev/xhs-pain-miner/issues"
Changelog = "https://github.com/mahingbun-dev/xhs-pain-miner/releases"

[project.scripts]
xhs-pain-miner = "xhs_pain_miner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xhs_pain_miner" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["skill"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
