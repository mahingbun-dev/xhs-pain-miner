name: CI

on:
  push:
    branches: [main, develop]
  # **不限定 base 分支**。原先是 ``branches: [main]``，于是任何以集成分支
  # （如 ``feat/m2-research``）为 base 的 PR，一条检查都不会触发 —— 而这类 PR
  # 恰恰改动量更大、还要再经一次合并。它们会以 "0 个检查" 的状态摆在评审页上，
  # 与"检查全绿"在视觉上难以区分（两者都只剩一个可点的合并按钮），
  # 于是最需要检查的那一类 PR 反而在零信号下被合掉。
  #
  # 触发条件与「CI 要跑什么」是两件事：这里只放开 base，job 内容一个字没动。
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # 从 pyproject 的 [dev] extra 取 ruff，而不是裸 `pip install ruff`：
      # ruff 的次版本会调整格式规则，版本漂移会让 format --check 在无关 PR 上无故变红。
      - run: pip install -e ".[dev]"
      # tools/ 也要检查：M1 新增的评估与联调脚本同样会被维护，不该成为 lint 盲区。
      - run: ruff check src/ tests/ tools/
      - run: ruff format --check src/ tests/ tools/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 必须装 analysis + vlm：M1 起向量化与归集是**核心链路**，缺了它们
      # `mine` 完全跑不起来。测试本身仍不联网、不需要 API Key（用注入的假
      # LLM / 假编码器），但需要这些库能被 import。
      - run: pip install -e ".[analysis,vlm,dev]"
      - run: pytest --cov=src --cov-report=xml
      # 评估脚本的离线自检。验收门（召回/误报）依赖 tools/eval_research.py 里那份
      # **手写**的案例数据，而手写数据容易在改动时自相矛盾 —— 比如同一个关键词
      # 同时进了 expect_any 与 expect_none，于是同一条结果既算召回又算误报，
      # 指标悄悄失真。这一步把它钉住，且不需要网络。
      - name: 竞品调研评估脚本自检（不联网）
        run: python tools/eval_research.py --offline
      - uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.10'

  # 打包回归防护：M0 之前 build-backend 是无效值且缺少 package-dir，
  # 导致 "pip install -e" 装不出可导入的包 —— 这个 job 防止该问题复发。
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装并验证包可导入
        run: |
          pip install -e ".[dev]"
          python -c "import xhs_pain_miner; print('version:', xhs_pain_miner.__version__)"
      - name: 验证 CLI 入口可用
        run: |
          xhs-pain-miner --version
          xhs-pain-miner --help
      # 必须用 heredoc 而不是 `python -c "` 跟多行缩进：YAML 会把那样的多行
      # 标量**折叠成一行**（换行变空格），Python 收到 " from ... import ..." 后
      # 直接 IndentationError —— 这个 job 因此从加入起就没真正跑通过。
      - name: 验证内置样例数据随包分发
        run: |
          python - <<'PY'
          from xhs_pain_miner.collectors.fixture import FixtureBackend

          corpus = FixtureBackend().collect("防晒霜", limit=999, max_comments_per_note=999)
          assert corpus.notes, "内置样例数据为空"
          assert corpus.comments, "内置样例评论为空"
          assert corpus.total_images, "内置样例图片为空"
          print("fixture ok:", corpus.summary())
          PY
